# Поиск клиентов 24/7: задача работает ~5 ч 45 мин, потом сама завершается.
# Расписание запускает новую каждый час: пока идёт старая, новая ждёт в очереди и стартует сразу после неё.
name: client-search

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

concurrency:
  group: client-search
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          pip install -q playwright
          python -m playwright install --with-deps chromium

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: |
            state.json
            settings.json
            bot-control.json
            log.txt
          key: state-latest
          restore-keys: state-

      - name: Run
        env:
          CLOUD: "1"
          TZ: Europe/Moscow
          PYTHONIOENCODING: utf-8
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          WEB_STATE_0: ${{ secrets.WEB_STATE_0 }}
          WEB_STATE_1: ${{ secrets.WEB_STATE_1 }}
          WEB_STATE_2: ${{ secrets.WEB_STATE_2 }}
          WEB_STATE_3: ${{ secrets.WEB_STATE_3 }}
          WEB_STATE_4: ${{ secrets.WEB_STATE_4 }}
          WEB_STATE_5: ${{ secrets.WEB_STATE_5 }}
          WEB_STATE_6: ${{ secrets.WEB_STATE_6 }}
          WEB_STATE_7: ${{ secrets.WEB_STATE_7 }}
        run: python cloud_run.py

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            state.json
            settings.json
            bot-control.json
            log.txt
          key: state-${{ github.run_id }}-${{ github.run_attempt }}
