# Поиск клиентов 24/7: задача работает ~5 ч 45 мин, потом сама завершается.
# Расписание запускает новую каждый час: пока идёт старая, новая ждёт в очереди и стартует сразу после неё.
# Отложенный старт: пока не наступило время из переменной репозитория START_AFTER, задача сразу завершается.
# ИИ необязателен: без ключей бот работает на правилах бесплатно. С секретом GROQ_API_KEY или OPENROUTER_API_KEY — пишет ИИ (тоже бесплатно).
name: client-search

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

concurrency:
  group: client-search
  cancel-in-progress: false

permissions:
  contents: read
  actions: write        # только для шага keepalive ниже

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - name: Keepalive (GitHub отключает расписание после 60 дней без активности)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/client-search.yml/enable" || true

      - name: Gate (отложенный старт)
        id: gate
        env:
          START_AFTER: ${{ vars.START_AFTER }}
        run: |
          if [ -n "$START_AFTER" ] && [ "$(date -u +%s)" -lt "$(date -u -d "$START_AFTER" +%s)" ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"; echo "Рано: старт после $START_AFTER"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: "3.11"

      - name: Install
        if: steps.gate.outputs.go == 'true'
        run: |
          pip install -q playwright
          python -m playwright install --with-deps chromium

      - name: Restore state
        if: steps.gate.outputs.go == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            state.json
            settings.json
            bot-control.json
            log.txt
          key: state-latest
          restore-keys: state-

      - name: Run
        if: steps.gate.outputs.go == 'true'
        env:
          CLOUD: "1"
          CONTACTS_PART: "0"          # половина контактов Егора; у Саши "1"
          TZ: Europe/Moscow
          PYTHONIOENCODING: utf-8
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STATE_SEED: ${{ secrets.STATE_SEED }}
          WEB_STATE_0: ${{ secrets.WEB_STATE_0 }}
          WEB_STATE_1: ${{ secrets.WEB_STATE_1 }}
          WEB_STATE_2: ${{ secrets.WEB_STATE_2 }}
          WEB_STATE_3: ${{ secrets.WEB_STATE_3 }}
          WEB_STATE_4: ${{ secrets.WEB_STATE_4 }}
          WEB_STATE_5: ${{ secrets.WEB_STATE_5 }}
          WEB_STATE_6: ${{ secrets.WEB_STATE_6 }}
          WEB_STATE_7: ${{ secrets.WEB_STATE_7 }}
        run: python cloud_run.py

      - name: Stats (только цифры воронки, без имён)
        if: always() && steps.gate.outputs.go == 'true'
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
        run: python crm.py stats state.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save state
        if: always() && steps.gate.outputs.go == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            state.json
            settings.json
            bot-control.json
            log.txt
          key: state-${{ github.run_id }}-${{ github.run_attempt }}
